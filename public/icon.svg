<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="tapeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardboardCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="32" height="32" rx="7" fill="url(#apexBg)" />

  <!-- Tape Strip Peeling from Top -->
  <path d="M 14 6.5 L 26 6.5 C 27.1 6.5 28 7.4 28 8.5 L 28 10 L 16 10 Z" fill="url(#tapeBody)" />

  <!-- Main Tape Roll Outer Ring -->
  <circle cx="14" cy="16.5" r="9.5" fill="none" stroke="url(#tapeBody)" stroke-width="4.5" />

  <!-- Cardboard Core -->
  <circle cx="14" cy="16.5" r="5.25" fill="url(#cardboardCore)" />

  <!-- Core Hole (Center Cutout) -->
  <circle cx="14" cy="16.5" r="2.75" fill="#0f172a" />

  <!-- Subtle Tape Shine / Highlight -->
  <path d="M 7 13 A 8 8 0 0 1 14 8.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
</svg>
